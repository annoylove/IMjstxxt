# 生产模式一键启动：MySQL + MongoDB + Redis + IM 后端（STORAGE_MODE=real）
# 使用：docker compose up -d --build
# 停止：docker compose down（加 -v 会清空数据卷）
services:
  app:
    build: ./server
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      STORAGE_MODE: real
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: im_system
      MONGO_URI: mongodb://mongo:27017/im_messages
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: im_system
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  uploads:
